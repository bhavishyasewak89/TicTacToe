    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <style>

        * {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: lightcyan;
            
        }
        .container{
            height: 70vh;
            display: flex;
            justify-content: center;    
            align-items: center;    
        }
        .game{
            width: 60vmin;
            height: 60vmin;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5vmin;
            justify-content: center;
        }
        .box{
        width: 18vmin;
        height: 18vmin;
        border-radius: 1rem;
        border: none;   
        box-shadow: 0 0 1rem rgba(0, 0, 0, 0.3);   
        font-size: 8vmin;
        color: red;
        background-color: blue
        }
        #reset{
            padding: 1rem;
            font-size: 1.25rem;
            background: crimson;
            color: wheat;
            border-radius: 1rem;
            border: none;
            margin-left: 600px;
        }
        .box:hover {
            background-color: chocolate;
        }
        #new-btn {
            padding: 1rem;
            font-size: 1.25rem;
            background:rebeccapurple;
            color: white;
            border-radius: 1rem;
            border: none;
            text-align: center;
            margin-left: 600px;
        }
        #msg{
                font-size: 8vmin;
        }
        .msg-container{
            height: 22vmin;
        }
        .hide {
            display: none  ;
        }
        .score-board {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 10px 30px;
        }
        
        .bhav {
            font-size: 33px;
            text-align: left;
        }
        
        .rom {
            font-size: 33px;
            text-align: right;
        }





    </style>
    <body>
        
    <div class="msg-container hide">
        <p id="msg" style="text-align: center;">Winner</p>
        <button id="new-btn" >NEW GAME</button>
    </div>
    <main>
        <h1 style="text-align: center;">TIC TAC TOE</h1>
        <div class="bhav">
            PLAYER 1 <br>
            Score: <span id="score1">0</span>
        </div>
        
        <div class="rom">
            PLAYER 2 <br>
            Score: <span id="score2">0</span>
        </div>
        
        <div class="container">
            <div class="game">
                
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
            </div>
        </div>
        <button id="reset">RESTART GAME</button>
    </main>
    <script>
        
        let boxes =[...document.querySelectorAll('.box')];
        let resetBtn = document.querySelector('#reset');
        let turnO = true;
        let newGameBtn = document.querySelector('#new-btn');
        let msgContainer = document.querySelector('.msg-container');
        let msg = document.querySelector('#msg');
        let score1 = 0;
        let score2 = 0;

        let score1Element = document.querySelector('#score1');
        let score2Element = document.querySelector('#score2');

        const winPatterns = [
        [0,1,2],
        [0,3,6],
        [0,4,8],
        [1,4,7],
        [2,5,8],
        [2,4,6],
        [3,4,5],
        [6,7,8],
        ];

        boxes.forEach((box)=>{
            box.addEventListener('click',function (){
                if (turnO){
                    box.innerText='O';
                    box.style.color ='red';
                    turnO=false;
                    box.disabled = true;
                    checkWinner();

                }else {
                    box.innerText = 'X';
                    box.style.color = 'black';
                    turnO = true;
                    box.disabled = true;
                    checkWinner();
                }
            });
        });

        const enableBoxes =() => {
            for(let box of boxes){
                box.disabled=false;
                box.innerText="";
                box.style.color = "silver";
            }
        };

        const disableBoxes= () => {
            for(let box of boxes){
                box.disabled =true;
            }
        };

        const showWinner = (winner) => {

            if (winner === 'O') {
                score1++;
                score1Element.innerText = score1;
            } 
            else if (winner === 'X') {
                score2++;
                score2Element.innerText = score2;
            }
        
            msg.innerText = `Congratulations, Winner is ${winner}`;
            msgContainer.classList.remove('hide');
            disableBoxes();
        };

        const checkWinner = () => {
            let hasWin = false;
            for (let pattern of winPatterns) {
                let pos1Val = boxes[pattern[0]].innerText;
                let pos2Val = boxes[pattern[1]].innerText;
                let pos3Val = boxes[pattern[2]].innerText;

                if (pos1Val !== "" && pos2Val!=="" && pos3Val!=="" && 
                    pos1Val === pos2Val && pos2Val === pos3Val) {
                    showWinner(pos1Val);
                    hasWin = true;
                    return;
                }
            }

        if(!hasWin){
            const allBoxes =[...boxes].every((box)=>box.innerText !=="");
            if(allBoxes){
                msgContainer.classList.remove('hide');
                msg.innerText ='Match Draw';
                disableBoxes();
            }
        }

    };

    const RESTART =() =>{
        turnO =true;
        enableBoxes();
        msgContainer.classList.add('hide');
    };


    newGameBtn.addEventListener('click',RESTART);
    resetBtn.addEventListener('click',RESTART);

        
        
        











    </script>











    </body>
    </html>
